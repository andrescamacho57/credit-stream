name: dbt CI

# Run on pull requests targeting main, and on manual trigger.
# Not on every push to main - by then it is too late to block anything.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dbt Fusion
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write the private key
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE_END'
          credit_stream:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /home/runner/.snowflake/rsa_key.p8
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: COMPUTE_WH
                database: CREDIT_STREAM
                schema: dbt_ci
                threads: 8
          PROFILE_END

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps

      - name: Verify the connection
        working-directory: dbt
        run: dbt debug

      - name: Build and test
        working-directory: dbt
        run: dbt build