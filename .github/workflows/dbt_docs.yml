name: Publish dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dbt Fusion
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write the private key
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE_END'
          credit_stream:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /home/runner/.snowflake/rsa_key.p8
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: COMPUTE_WH
                database: CREDIT_STREAM
                schema: dbt_ci
                threads: 8
          PROFILE_END

      - name: Generate docs
        working-directory: dbt
        run: |
          dbt deps
          dbt docs generate

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4